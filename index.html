<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻酔準備ナビ＆計算アシスト</title>
    <style>
        /* --- ベーススタイル（Apple Health風） --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #F2F2F7; 
            color: #1C1C1E;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #000;
        }
        h2, h3 {
            font-weight: 600;
            margin-top: 0;
        }

        /* --- iOS風 タブ --- */
        .tabs {
            display: flex;
            background-color: #E3E3E8;
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 24px;
        }
        .tab-btn {
            flex: 1;
            background-color: transparent;
            border: none;
            padding: 10px 0;
            font-size: 15px;
            font-weight: 600;
            color: #8E8E93;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background-color: #FFFFFF;
            color: #1C1C1E;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 3px 1px rgba(0,0,0,0.04);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Card UI 共通設定 --- */
        .card {
            background-color: #FFFFFF;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.03);
        }

        /* --- フォーム・ボタン --- */
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #8E8E93;
            margin-bottom: 8px;
        }
        select, input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid #E5E5EA;
            border-radius: 10px;
            background-color: #FAFAFC;
            box-sizing: border-box;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #007AFF; 
            background-color: #FFFFFF;
        }
        input[type="number"] {
            width: 80px;
            display: inline-block;
            margin-bottom: 0;
            margin-right: 8px;
            text-align: right;
            font-weight: 600;
        }
        button.action-btn { 
            width: 100%;
            background-color: #007AFF; 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            font-size: 16px; 
            font-weight: 600;
            cursor: pointer; 
            border-radius: 12px; 
            transition: opacity 0.2s;
        }
        button.action-btn:active {
            opacity: 0.7;
        }
        button.action-btn.calc {
            background-color: #34C759; 
        }

        /* --- リスト型UI (タブ1) --- */
        .list-item {
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid #E5E5EA;
            padding: 16px 0;
        }
        .list-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .item-category {
            font-size: 12px;
            font-weight: 600;
            color: #8E8E93;
        }
        .item-badge {
            background-color: #FF3B30;
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
        }
        .item-name-row {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }
        .item-name {
            font-size: 18px;
            font-weight: 600;
            color: #1C1C1E;
            margin-right: 10px;
        }
        
        /* 画像表示ボタン */
        .img-btn {
            background-color: #E5E5EA;
            color: #1C1C1E;
            border: none;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background-color 0.2s;
        }
        .img-btn:hover {
            background-color: #D1D1D6;
        }

        .item-spec {
            font-size: 14px;
            color: #3A3A3C;
        }
        .why-btn { 
            background-color: #F2F2F7; 
            color: #007AFF; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 16px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: 600;
            margin-top: 10px;
            align-self: flex-start;
        }
        .why-text { 
            display: none; 
            background-color: #F2F2F7; 
            padding: 12px; 
            margin-top: 10px; 
            border-radius: 10px; 
            font-size: 14px; 
            color: #3A3A3C;
            line-height: 1.5;
        }

        /* --- 画像モーダル（ポップアップ） --- */
        .modal-overlay {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        .modal-content {
            background-color: #FFF;
            padding: 20px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1C1C1E;
        }
        .modal-image {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 8px;
            background-color: #F2F2F7;
        }
        .modal-close {
            margin-top: 16px;
            background-color: #E5E5EA;
            color: #1C1C1E;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        /* --- 計算エリア (タブ2) --- */
        .input-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 15px;
        }
        .input-row strong { width: 50px; color: #8E8E93; }
        .input-group {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #E5E5EA;
        }
        .input-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .step-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid #E5E5EA;
        }
        .step-box:last-of-type { border-bottom: none; }
        .step-label { font-size: 16px; font-weight: 600; color: #3A3A3C; }
        .step-value { font-size: 28px; font-weight: 700; color: #007AFF; }
        .step-value.finish { color: #34C759; }
        .step-unit { font-size: 16px; font-weight: 600; color: #8E8E93; margin-left: 4px; }
        .logic-box {
            background-color: #F2F2F7;
            padding: 16px;
            margin-top: 24px;
            font-size: 14px;
            line-height: 1.6;
            border-radius: 12px;
            color: #3A3A3C;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>麻酔業務アシスト</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('nav-tab')">準備ナビ</button>
        <button class="tab-btn" onclick="switchTab('calc-tab')">薬剤計算</button>
    </div>

    <!-- タブ1: 準備ナビ -->
    <div id="nav-tab" class="tab-content active">
        <div class="card">
            <label>術式を選択してください</label>
            <select id="procedure-select" style="margin-bottom: 16px;">
                <option value="">-- 選択 --</option>
                <option value="kuwana_zenshin">桑名Dr / 泌尿器：膀胱癌 (全身麻酔)</option>
                <option value="kuwana_sekima">桑名Dr / 整形：左大腿転子部骨折 (脊椎麻酔)</option>
            </select>
            <button class="action-btn" onclick="showPreparationList()">リストを表示</button>
        </div>

        <div id="result-area" class="card" style="display: none;">
            <h2 id="result-title" style="font-size: 18px; border-bottom: 2px solid #F2F2F7; padding-bottom: 12px; margin-bottom: 10px;"></h2>
            <div id="result-list"></div>
        </div>
    </div>

    <!-- 画像表示用モーダル（ポップアップ） -->
    <div id="image-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title" id="modal-drug-name">薬剤名</div>
            <!-- 画像のプレースホルダー -->
            <img id="modal-drug-img" src="" alt="薬剤の画像" class="modal-image">
            <button class="modal-close" onclick="closeModal()">閉じる</button>
        </div>
    </div>

    <!-- タブ2: 薬剤計算アシスト（省略せずそのまま） -->
    <div id="calc-tab" class="tab-content">
        <div class="card">
            <label>よく使う薬剤のプリセット</label>
            <select id="drug-preset" onchange="loadPreset()" style="margin-bottom: 0;">
                <option value="">-- 手動入力 --</option>
                <option value="ephedrine">エフェドリン (40mg/1ml)</option>
                <option value="neosynephrine">ネオシネジン (1mg/1ml)</option>
            </select>
        </div>
        
        <div class="card">
            <div class="input-group">
                <label>原液情報</label>
                <div class="input-row">
                    <strong>濃度</strong>
                    <input type="number" id="stock-mg" value="40"> <span style="margin-right: 12px;">mg</span> / 
                    <input type="number" id="stock-ml" value="1" style="margin-left: 12px;"> <span>ml</span>
                </div>
            </div>
            
            <div class="input-group">
                <label>作成したい目標</label>
                <div class="input-row">
                    <strong>濃度</strong>
                    <input type="number" id="target-mg" value="4"> <span style="margin-right: 12px;">mg</span> / 
                    <input type="number" id="target-ml" value="1" style="margin-left: 12px;"> <span>ml</span>
                </div>
                <div class="input-row">
                    <strong>総量</strong>
                    <input type="number" id="total-ml" value="10"> <span>ml</span>
                </div>
            </div>
            
            <button class="action-btn calc" onclick="calculateDilution()">計算して手順を表示</button>
        </div>

        <div id="calc-result" class="card" style="display: none;">
            <h3 style="margin-bottom: 16px;">シリンジ作成手順</h3>
            <div class="step-box">
                <div class="step-label"><span style="color:#8E8E93; margin-right:8px;">1</span>原液を吸う</div>
                <div><span id="res-stock-ml" class="step-value"></span><span class="step-unit">ml</span></div>
            </div>
            <div class="step-box">
                <div class="step-label"><span style="color:#8E8E93; margin-right:8px;">2</span>生食を足す</div>
                <div><span id="res-diluent-ml" class="step-value"></span><span class="step-unit">ml</span></div>
            </div>
            <div class="step-box">
                <div class="step-label"><span style="color:#8E8E93; margin-right:8px;">3</span>完成（全量）</div>
                <div><span id="res-total-ml" class="step-value finish"></span><span class="step-unit">ml</span></div>
            </div>
            <div class="logic-box">
                <strong>💡 希釈のロジック</strong><br><br>
                ① 目標とする薬の総量は、<span id="log-t-mg"></span>mg / <span id="log-t-ml"></span>ml × <span id="log-total"></span>ml ＝ <b><span id="log-req-mg"></span>mg</b> です。<br><br>
                ② 原液の濃度は <span id="log-s-mg"></span>mg / <span id="log-s-ml"></span>ml なので、必要な原液量は <span id="log-req-mg2"></span>mg ÷ 原液濃度 ＝ <b><span id="log-req-ml"></span>ml</b> となります。<br><br>
                ③ 目的の量（<span id="log-total2"></span>ml）にするため、残りの <b><span id="log-diluent"></span>ml</b> を希釈液で薄めます。
            </div>
        </div>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // データベースに `imgUrl` を追加
    // 実際にご自身の環境で使う際は、アンプルの写真のURLやローカルの画像パス（例: "images/propofol.jpg"）に書き換えてください。
    const database = {
        "kuwana_zenshin": {
            title: "桑名Dr / 泌尿器：膀胱癌 (全身麻酔)",
            items: [
                { category: "鎮静薬", name: "プロポフォール", spec: "20ml (20ccロック+18G)", kinko: false, imgUrl: "images/propofol.jpg.jpg", why: "寝かせるため。起きている状態で筋弛緩すると金縛りにあった様になってしまうため注意。" },
                { category: "筋弛緩薬", name: "ロクロニウム", spec: "50mg/5.0ml (5ccロック+18G)", kinko: true, imgUrl: "ロクロニウム.jpg", why: "自発呼吸も完全に止まるため人工呼吸器管理が必要。効果が出るのが遅い。" },
                { category: "鎮痛薬", name: "レミフェンタニル", spec: "2mg/20ml (20ccロック＋18G)", kinko: true, imgUrl: "https://placehold.jp/150/ffffff/000000/300x200.png?text=レミフェンタニル%0A(バイアル画像)", why: "シリンジポンプで持続投与するため、赤くて細いエクステンションをつける。" },
                { category: "昇圧薬", name: "エフェドリン", spec: "10ml (10ccロック+18G)", kinko: false, imgUrl: "images/エフェドリン.jpg", why: "生食で希釈し4mg/1mlにする。NIBPのmean60を下回ったら使用。" },
                { category: "気道確保", name: "アイゲル(LMA)", spec: "サイズ：#4", kinko: false, imgUrl: null, why: "男性は4、女性は3が目安。" }
            ]
        },
        "kuwana_sekima": {
            title: "桑名Dr / 整形：左大腿転子部骨折 (脊椎麻酔)",
            items: [
                { category: "麻酔針", name: "25G ペンシル針", spec: "L3/4 para", kinko: false, imgUrl: null, why: "ペンシル型は硬膜の繊維を「押し広げて」進むため、硬膜穿刺後頭痛（PDPH）が発生しにくい。" },
                { category: "輸液", name: "フィジオ（酢酸リンゲル液）", spec: "500ml", kinko: false, imgUrl: null, why: "末梢組織でも素早く代謝されてアルカリに変わる「酢酸」を含み、安全に酸塩基平衡を補正できる。" },
                { category: "昇圧薬", name: "エフェドリン", spec: "10ml (10ccロック+18G)", kinko: false, imgUrl: "エフェドリン.jpg", why: "生食で希釈し4mg/1mlにする。脊麻による血圧低下時に使用。" }
            ]
        }
    };

    function showPreparationList() {
        const selectedValue = document.getElementById("procedure-select").value;
        const resultList = document.getElementById("result-list");
        resultList.innerHTML = "";

        if (!selectedValue) {
            document.getElementById("result-area").style.display = "none";
            return;
        }

        const data = database[selectedValue];
        document.getElementById("result-title").textContent = data.title;

        data.items.forEach((item, index) => {
            const kinkoMark = item.kinko ? '<span class="item-badge">金庫管理</span>' : '';
            const whyId = `why-${index}`;
            const whyHtml = item.why ? `<button class="why-btn" onclick="toggleWhy('${whyId}')">ℹ️ 理由・ポイント</button><div id="${whyId}" class="why-text">${item.why}</div>` : '';
            
            // 画像ボタンの生成 (imgUrlが登録されている場合のみ表示)
            const imgBtnHtml = item.imgUrl ? `<button class="img-btn" onclick="openModal('${item.name}', '${item.imgUrl}')">📸 画像</button>` : '';

            const itemDiv = document.createElement("div");
            itemDiv.className = "list-item";
            itemDiv.innerHTML = `
                <div class="item-header">
                    <span class="item-category">${item.category}</span>
                    ${kinkoMark}
                </div>
                <div class="item-name-row">
                    <div class="item-name">${item.name}</div>
                    ${imgBtnHtml}
                </div>
                <div class="item-spec">${item.spec}</div>
                ${whyHtml}
            `;
            resultList.appendChild(itemDiv);
        });
        document.getElementById("result-area").style.display = "block";
    }

    function toggleWhy(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === "none" || el.style.display === "") ? "block" : "none";
    }

    /* --- モーダル（画像ポップアップ）制御関数 --- */
    function openModal(drugName, imgUrl) {
        document.getElementById("modal-drug-name").textContent = drugName;
        document.getElementById("modal-drug-img").src = imgUrl;
        document.getElementById("image-modal").style.display = "flex";
    }

    function closeModal(event) {
        // 背景クリック時または閉じるボタンクリック時に閉じる
        document.getElementById("image-modal").style.display = "none";
        document.getElementById("modal-drug-img").src = ""; // 閉じた時に画像をリセット
    }

    /* --- 計算機制御関数 --- */
    function loadPreset() {
        const val = document.getElementById("drug-preset").value;
        if (val === "ephedrine") {
            document.getElementById("stock-mg").value = 40;
            document.getElementById("stock-ml").value = 1;
            document.getElementById("target-mg").value = 4;
            document.getElementById("target-ml").value = 1;
            document.getElementById("total-ml").value = 10;
        } else if (val === "neosynephrine") {
            document.getElementById("stock-mg").value = 1;
            document.getElementById("stock-ml").value = 1;
            document.getElementById("target-mg").value = 0.1;
            document.getElementById("target-ml").value = 1;
            document.getElementById("total-ml").value = 10;
        }
    }

    function calculateDilution() {
        const stockMg = parseFloat(document.getElementById("stock-mg").value);
        const stockMl = parseFloat(document.getElementById("stock-ml").value);
        const targetMg = parseFloat(document.getElementById("target-mg").value);
        const targetMl = parseFloat(document.getElementById("target-ml").value);
        const totalMl = parseFloat(document.getElementById("total-ml").value);

        if (!stockMg || !stockMl || !targetMg || !targetMl || !totalMl) {
            alert("数値を正しく入力してください");
            return;
        }

        const stockConc = stockMg / stockMl;
        const targetConc = targetMg / targetMl;
        const requiredTotalMg = targetConc * totalMl;
        const requiredStockMl = requiredTotalMg / stockConc;
        const diluentMl = totalMl - requiredStockMl;

        document.getElementById("res-stock-ml").textContent = requiredStockMl;
        document.getElementById("res-diluent-ml").textContent = diluentMl;
        document.getElementById("res-total-ml").textContent = totalMl;

        document.getElementById("log-t-mg").textContent = targetMg;
        document.getElementById("log-t-ml").textContent = targetMl;
        document.getElementById("log-total").textContent = totalMl;
        document.getElementById("log-req-mg").textContent = requiredTotalMg;
        document.getElementById("log-s-mg").textContent = stockMg;
        document.getElementById("log-s-ml").textContent = stockMl;
        document.getElementById("log-req-mg2").textContent = requiredTotalMg;
        document.getElementById("log-req-ml").textContent = requiredStockMl;
        document.getElementById("log-total2").textContent = totalMl;
        document.getElementById("log-diluent").textContent = diluentMl;

        document.getElementById("calc-result").style.display = "block";
    }
</script>

</body>
</html>
